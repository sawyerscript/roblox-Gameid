<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Place → GameId Finder</title>
<style>
body {
    margin:0;
    background:#0b0f19;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box {
    background:#111827;
    padding:25px;
    border-radius:14px;
    width:350px;
}
input, button {
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:8px;
    border:none;
}
input {
    background:#1f2937;
    color:white;
}
button {
    background:#3b82f6;
    color:white;
    cursor:pointer;
}
button:hover {
    background:#2563eb;
}
.result {
    margin-top:15px;
    padding:10px;
    background:#1f2937;
    border-radius:8px;
    display:none;
}
.error {
    color:#f87171;
    margin-top:10px;
    font-size:13px;
}
</style>
</head>
<body>

<div class="box">
<h2>Place → GameId</h2>

<input id="placeId" placeholder="Enter Place ID">

<button onclick="fetchId()">Get Game ID</button>

<div class="result" id="result">
Universe ID: <span id="uid"></span>
</div>

<div class="error" id="err"></div>
</div>

<script>
async function fetchId() {
    const id = document.getElementById("placeId").value.trim();
    const err = document.getElementById("err");
    const resBox = document.getElementById("result");

    err.textContent = "";
    resBox.style.display = "none";

    if (!id) {
        err.textContent = "Enter a Place ID";
        return;
    }

    try {
        // PUBLIC CORS PROXY (works for quick testing)
        const api = `https://api.allorigins.win/raw?url=` +
        encodeURIComponent(`https://apis.roblox.com/universes/v1/places/${id}/universe`);

        const res = await fetch(api);
        const data = await res.json();

        document.getElementById("uid").textContent = data.universeId;
        resBox.style.display = "block";

    } catch (e) {
        err.textContent = "Failed to fetch GameId (invalid ID or API blocked)";
    }
}
</script>

</body>
</html>
