<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Roblox ID Converter</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>
  <div class="bg"></div>

  <div class="card">
    <h1>Roblox Place → Game ID</h1>
    <p class="sub">Convert Place IDs into Universe (Game) IDs instantly</p>

    <div class="input-row">
      <input id="placeId" placeholder="Enter Place ID..." />
      <button onclick="convert()">Convert</button>
    </div>

    <div id="loading" class="loading hidden"></div>

    <div id="result" class="result hidden"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
